[package]
name = "bgpui-kit"
version = "0.1.0"
edition = "2024"
description = "Shared theme tokens and small GPUI components for bokuweb desktop apps"

[dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "5a564d4e798f18b66e9c0d85b651e96d3450b0a7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
